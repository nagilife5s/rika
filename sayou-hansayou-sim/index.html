<title>作用・反作用の法則</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
/* Layout: 投影用の1画面ステージ。上にタブ、中央に大きな図、下に説明と操作。 */
:root{
  --bg:#eef1f4; --panel:#ffffff; --ink:#15233b; --sub:#56637a; --line:#cfd6df; --soft:#e4e9ef;
  --act:#1f63c6; --react:#d9480f; --ok:#1d8a4e; --ng:#c0262d; --obj:#ffd75e; --obj2:#9fd3c7; --floor:#9aa6b6;
  --font:"BIZ UDPGothic","BIZ UDゴシック","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1622; --panel:#172131; --ink:#e8eef7; --sub:#9fb0c8; --line:#2c3a50; --soft:#1f2b3e;
  --act:#5b9dff; --react:#ff8a4c; --ok:#4cc78a; --ng:#ff6b70; --obj:#e3b93a; --obj2:#4f9e8e; --floor:#5d6b80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1622; --panel:#172131; --ink:#e8eef7; --sub:#9fb0c8; --line:#2c3a50; --soft:#1f2b3e;
  --act:#5b9dff; --react:#ff8a4c; --ok:#4cc78a; --ng:#ff6b70; --obj:#e3b93a; --obj2:#4f9e8e; --floor:#5d6b80; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 24px}
.wrap{max-width:1400px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.eyebrow{font-size:14px;letter-spacing:.14em;color:var(--sub)}
h1{margin:0;font-size:clamp(26px,3vw,40px);line-height:1.2;text-wrap:balance}
h1 .a{color:var(--act)} h1 .r{color:var(--react)}
button{font:inherit;color:inherit;cursor:pointer;border:2px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 18px;min-height:48px}
button:hover{border-color:var(--sub)}
button:focus-visible,input:focus-visible{outline:3px solid var(--act);outline-offset:2px}
.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
nav{display:flex;gap:8px;flex-wrap:wrap}
nav button{font-size:18px;font-weight:700;border-radius:999px;padding:8px 20px}
nav button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px 24px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
svg{display:block;width:100%;height:auto}
svg text{font-family:var(--font);fill:var(--ink)}
.lead{font-size:clamp(20px,2.2vw,28px);font-weight:700;margin:0 0 6px;text-wrap:balance}
.note{color:var(--sub);font-size:16px;margin:0}
.ctrl{display:flex;flex-direction:column;gap:14px}
.ctrl label{display:flex;justify-content:space-between;font-weight:700}
.ctrl output{font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--ink);height:28px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1}
.seg button[aria-pressed="true"]{background:var(--soft);border-color:var(--ink)}
.meter{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-variant-numeric:tabular-nums}
.meter .bar{height:14px;border-radius:7px;background:var(--soft);overflow:hidden}
.meter .bar i{display:block;height:100%;border-radius:7px}
.key{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-1px;margin-right:6px}
.law{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:900px){.law{grid-template-columns:repeat(2,minmax(0,1fr))}}
.law div{background:var(--soft);border-radius:14px;padding:14px 16px;font-size:clamp(17px,1.6vw,22px);font-weight:700}
.law small{display:block;font-weight:400;font-size:15px;color:var(--sub)}
.law b{color:var(--act)}
.scenes{display:flex;gap:8px;flex-wrap:wrap}
.scenes button[aria-pressed="true"]{background:var(--soft);border-color:var(--ink);font-weight:700}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:700px){.pair{grid-template-columns:1fr}}
.pair div{border-radius:14px;padding:14px 18px;font-size:clamp(18px,1.9vw,25px);font-weight:700;border:3px solid}
.pair .pa{border-color:var(--act);color:var(--act)}
.pair .pr{border-color:var(--react);color:var(--react)}
.pair .pr.off{border-style:dashed;color:var(--sub);border-color:var(--line)}
.pair small{display:block;color:var(--sub);font-weight:400;font-size:15px}
.flist{display:flex;flex-direction:column;gap:8px}
.flist button{text-align:left;display:flex;gap:10px;align-items:center}
.flist button[aria-pressed="true"]{border-color:var(--ink);background:var(--soft)}
.flist .sw{width:18px;height:18px;border-radius:50%;flex:none}
.verdict{font-size:clamp(20px,2vw,28px);font-weight:700;margin:0}
.chk{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
@media (max-width:700px){.chk{grid-template-columns:1fr 1fr}}
.chk span{background:var(--soft);border-radius:10px;padding:8px 10px;font-size:15px;text-align:center}
.chk .y{outline:2px solid var(--ok)} .chk .n{outline:2px solid var(--ng)}
.q{font-size:clamp(21px,2.3vw,30px);font-weight:700;margin:0 0 14px;text-wrap:balance}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:700px){.choices{grid-template-columns:1fr}}
.choices button{text-align:left;font-size:clamp(18px,1.8vw,23px);padding:14px 18px}
.choices button.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--panel))}
.choices button.ng{border-color:var(--ng);background:color-mix(in srgb,var(--ng) 12%,var(--panel))}
.explain{margin-top:14px;padding:14px 18px;background:var(--soft);border-radius:12px;font-size:clamp(17px,1.7vw,22px)}
.qnav{display:flex;align-items:center;gap:10px;margin-top:14px}
.qnav span{margin-left:auto;color:var(--sub);font-variant-numeric:tabular-nums}
.tabpane[hidden]{display:none!important}
.stagebox{background:var(--soft);border-radius:14px;overflow:hidden}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
<header>
  <div>
    <div class="eyebrow">中学３年　運動とエネルギー　11｜作用・反作用の法則</div>
    <h1><span class="a">作用</span>と<span class="r">反作用</span></h1>
  </div>
  <div class="row">
    <button id="fs">全画面</button>
  </div>
</header>

<nav role="tablist" id="tabs">
  <button role="tab" data-tab="sim" aria-selected="true">① 押し合い実験</button>
  <button role="tab" data-tab="law" aria-selected="false">② 法則のまとめ</button>
  <button role="tab" data-tab="find" aria-selected="false">③ 力の相手さがし</button>
  <button role="tab" data-tab="bal" aria-selected="false">④ つり合いとの違い</button>
  <button role="tab" data-tab="quiz" aria-selected="false">⑤ 確認問題</button>
</nav>

<!-- ① 実験 -->
<section class="tabpane" id="sim">
  <div class="grid">
    <div class="card">
      <p class="lead" id="simLead"></p>
      <p class="note" style="font-size:clamp(17px,1.6vw,22px);color:var(--ink);margin:0 0 10px" id="simNote2"></p>
      <div class="stagebox"><svg id="simSvg" viewBox="0 0 1000 420" role="img" aria-label="台車に乗った二人の押し合い"></svg></div>
      <div class="row" style="margin-top:12px">
        <button id="sPrev">← 戻る</button>
        <button class="primary" id="sNext">次へ →</button>
        <button class="primary" id="play" style="background:var(--act);border-color:var(--act)">▶ 再生</button>
        <span id="stepNo" style="align-self:center;color:var(--sub);font-variant-numeric:tabular-nums"></span>
        <span style="flex:1"></span>
        <button id="slow" aria-pressed="false">スロー</button>
        <button id="reset">↺ 最初から</button>
      </div>
    </div>
    <div class="card ctrl">
      <div class="row seg">
        <button id="mPerson" aria-pressed="true">人どうし</button>
        <button id="mWall" aria-pressed="false">壁を押す</button>
      </div>
      <div><label for="mA">Aさんの質量 <output id="oA">50 kg</output></label><input type="range" id="mA" min="30" max="90" step="5" value="50"></div>
      <div id="boxB"><label for="mB">Bさんの質量 <output id="oB">50 kg</output></label><input type="range" id="mB" min="30" max="90" step="5" value="50"></div>
      <div><label for="F">押す力の大きさ <output id="oF">200 N</output></label><input type="range" id="F" min="50" max="400" step="10" value="200"></div>
      <div class="meter" id="meter"></div>
      <p class="note" id="simNote"></p>
    </div>
  </div>
</section>

<!-- ② 法則 -->
<section class="tabpane" id="law" hidden>
  <div class="card">
    <p class="lead">物体Aが物体Bに力を加えると、Aも<strong style="color:var(--react)">同時に</strong>Bから力を受ける。</p>
    <div class="stagebox" style="margin:12px 0"><svg id="lawSvg" viewBox="0 0 1000 300" role="img" aria-label="作用と反作用の矢印"></svg></div>
    <div class="law">
      <div><b>① 大きさ</b>等しい<small>矢印の長さが同じ</small></div>
      <div><b>② 向き</b>反対<small>押せば押し返される</small></div>
      <div><b>③ 作用線</b>同一直線上<small>同じ線の上にある</small></div>
      <div><b>④ はたらく物体</b>別々の物体<small>だから打ち消し合わない</small></div>
    </div>
    <p class="note" style="margin-top:12px">「作用」「反作用」の呼び名は、どちらの力に注目するかで入れかわる。2つの力に時間の前後はない。</p>
  </div>
</section>

<!-- ③ 相手さがし -->
<section class="tabpane" id="find" hidden>
  <div class="card">
    <div class="scenes" id="scenes"></div>
    <div class="stagebox" style="margin:14px 0"><svg id="findSvg" viewBox="0 0 1000 400" role="img" aria-label="場面の図"></svg></div>
    <div class="pair">
      <div class="pa" id="pa"></div>
      <div class="pr off" id="pr"></div>
    </div>
    <div class="row" style="margin-top:12px">
      <button class="primary" id="reveal">反作用を見る</button>
      <p class="note" id="findNote" style="align-self:center"></p>
    </div>
  </div>
</section>

<!-- ④ つり合い -->
<section class="tabpane" id="bal" hidden>
  <div class="grid">
    <div class="card">
      <p class="lead">机の上で静止している本。力を<strong>2つ</strong>選んで比べよう。</p>
      <div class="stagebox"><svg id="balSvg" viewBox="0 0 1000 460" role="img" aria-label="机の上の本にはたらく力"></svg></div>
    </div>
    <div class="card ctrl">
      <div class="flist" id="flist"></div>
      <p class="verdict" id="verdict">2つ選んでください</p>
      <div class="chk" id="chk"></div>
      <p class="note">見分けるポイントは<strong>「力を受ける物体」</strong>。同じ物体ならつり合い、別々なら作用・反作用。</p>
    </div>
  </div>
</section>

<!-- ⑤ 確認 -->
<section class="tabpane" id="quiz" hidden>
  <div class="card">
    <p class="q" id="qText"></p>
    <div class="choices" id="qChoices"></div>
    <div class="explain" id="qExp" hidden></div>
    <div class="qnav"><button id="qPrev">← 前へ</button><button class="primary" id="qNext">次へ →</button><span id="qCount"></span></div>
  </div>
</section>
</div>

<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const NS='http://www.w3.org/2000/svg';
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- SVG helpers ---------- */
let uid=0;
function arrow(x1,y1,x2,y2,color,label,opt={}){
  const id='h'+(uid++), w=opt.w||12, dx=x2-x1, dy=y2-y1, L=Math.hypot(dx,dy)||1, ux=dx/L, uy=dy/L;
  const hx=x2-ux*26, hy=y2-uy*26;
  const lx=opt.lx!=null?opt.lx:(x1+x2)/2+(opt.ox||0), ly=opt.ly!=null?opt.ly:(y1+y2)/2+(opt.oy||-22);
  return `<g opacity="${opt.op??1}">
   <line x1="${x1}" y1="${y1}" x2="${hx}" y2="${hy}" stroke="${color}" stroke-width="${w}" stroke-linecap="round"/>
   <polygon points="${x2},${y2} ${hx-uy*20},${hy+ux*20} ${hx+uy*20},${hy-ux*20}" fill="${color}"/>
   <circle cx="${x1}" cy="${y1}" r="8" fill="var(--panel)" stroke="${color}" stroke-width="4"/>
   ${label?`<text x="${lx}" y="${ly}" text-anchor="${opt.anchor||'middle'}" font-size="${opt.fs||24}" font-weight="700" style="fill:${color}">${label}</text>`:''}</g>`;
}
function person(cx,ground,s,face,name,fill,armTo){
  // s: scale, face: 1 => facing right
  const h=150*s, bw=46*s, head=22*s, top=ground-34-h;
  const armY=top+head*2+28*s;
  return `<g>
   <rect x="${cx-70}" y="${ground-26}" width="140" height="14" rx="7" fill="var(--sub)"/>
   <circle cx="${cx-48}" cy="${ground-6}" r="9" fill="var(--ink)"/><circle cx="${cx+48}" cy="${ground-6}" r="9" fill="var(--ink)"/>
   <rect x="${cx-bw/2}" y="${top+head*2}" width="${bw}" height="${h-head*2}" rx="${bw/2.4}" fill="${fill}"/>
   <circle cx="${cx}" cy="${top+head}" r="${head}" fill="${fill}"/>
   <line x1="${cx}" y1="${armY}" x2="${armTo!=null?armTo:cx+face*(bw/2+30)}" y2="${armY}" stroke="${fill}" stroke-width="${16*s}" stroke-linecap="round"/>
   <text x="${cx}" y="${top+head*2+ (h-head*2)/2+12}" text-anchor="middle" font-size="34" font-weight="700" style="fill:var(--panel)">${name}</text>
  </g>`;
}

/* ---------- Tabs ---------- */
const tabs=[...document.querySelectorAll('[role=tab]')];
function show(t){
  tabs.forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===t));
  document.querySelectorAll('.tabpane').forEach(p=>p.hidden=p.id!==t);
  try{history.replaceState(null,'','#'+t)}catch(e){}
  if(t==='law')drawLaw();
}
tabs.forEach(b=>b.onclick=()=>show(b.dataset.tab));
const start=location.hash.slice(1); if(tabs.some(b=>b.dataset.tab===start))show(start);
$('fs').onclick=()=>{const d=document.documentElement;(document.fullscreenElement?document.exitFullscreen():d.requestFullscreen?.())?.catch?.(()=>{})};

/* ---------- ① Simulator ---------- */
const S={mode:'person',mA:50,mB:50,F:200,T:0.25,t:0,run:false,slow:false,step:0};
const SCALE=90, G=360, X0=500, ARM=46;
const STEPS={
 person:[
  ['AさんがBさんの手を押します。','どちらが動くか予想しよう。床との摩擦は考えない。'],
  ['① Aが押す → <span style="color:var(--act)">AがBを押す力</span>が生まれる','この力を受けるのはBさん。'],
  ['② もし力がこの1本だけなら…？','力を受けるのはBだけ → <strong>Bだけが動き、Aは止まったまま</strong>のはず。（仮の世界）'],
  ['③ 実は同時に、<span style="color:var(--react)">BがAを押す力</span>も生まれている','2つの力は同時に生まれ、大きさは等しく、向きは反対。これが<strong>作用・反作用</strong>。'],
  ['④ 実際は… AもBも反対向きに動く！','Aを動かしたのは、Bから受けた力（反作用）。'],
 ],
 wall:[
  ['Aさんが動かない壁を押します。','Aさんはどうなるか予想しよう。床との摩擦は考えない。'],
  ['① Aが押す → <span style="color:var(--act)">Aが壁を押す力</span>が生まれる','この力を受けるのは壁。'],
  ['② もし力がこの1本だけなら…？','Aは力を受けていない → <strong>何も動かない</strong>はず。（仮の世界）'],
  ['③ 実は同時に、<span style="color:var(--react)">壁がAを押す力</span>も生まれている','壁は動かなくても、Aを押し返している。'],
  ['④ 実際は… Aが後ろへ動く！','Aを動かしたのは、壁から受けた力（反作用）。'],
 ]};
const animSteps=[2,4];
function accel(){
  const hypo=S.step===2;
  return {aA:hypo?0:S.F/S.mA, aB:S.mode==='wall'?0:S.F/S.mB};
}
function posAt(t){
  const {aA,aB}=accel(), T=S.T;
  const d=a=>t<T?0.5*a*t*t:0.5*a*T*T+a*T*(t-T);
  return {xA:-d(aA),xB:d(aB)};
}
function drawSim(){
  const {xA,xB}=posAt(S.t), contact=S.t<S.T, st=S.step;
  const sA=0.75+S.mA/200, sB=0.75+S.mB/200;
  const reach=s=>46*s/2+ARM;
  const cA=X0-reach(sA)+xA*SCALE, cB=X0+(S.mode==='wall'?999:reach(sB))+xB*SCALE;
  const fl=S.F/400*190+40;
  let g=`<rect x="0" y="${G}" width="1000" height="60" fill="var(--floor)" opacity=".35"/>
   <line x1="0" y1="${G}" x2="1000" y2="${G}" stroke="var(--floor)" stroke-width="3"/>`;
  for(let i=0;i<=10;i++)g+=`<line x1="${i*100}" y1="${G}" x2="${i*100}" y2="${G+12}" stroke="var(--floor)" stroke-width="2"/>`;
  if(st===2)g+=`<rect x="6" y="6" width="988" height="${G-12}" rx="12" fill="none" stroke="var(--sub)" stroke-width="3" stroke-dasharray="14 10"/>
   <text x="24" y="40" font-size="22" font-weight="700" style="fill:var(--sub)">仮の世界（反作用がないとしたら）</text>`;
  g+=person(cA,G,sA,1,'A','var(--act)',cA+46*sA/2+ARM);
  if(S.mode==='wall')g+=`<rect x="${X0}" y="70" width="70" height="${G-70}" fill="var(--sub)" opacity=".85"/>
     <text x="${X0+35}" y="110" text-anchor="middle" font-size="28" font-weight="700" style="fill:var(--panel)">壁</text>`;
  else g+=person(cB,G,sB,-1,'B','var(--react)',cB-46*sB/2-ARM);
  const y=G-34-150*sA+22*sA*2+28*sA;
  const px=X0;
  const showAct=st>=1&&contact, showReact=st>=3&&st!==2&&contact;
  if(showAct)g+=arrow(px,80,px+fl,80,'var(--act)',S.mode==='wall'?'Aが壁を押す力（壁が受ける）':'AがBを押す力（Bが受ける）',{lx:px+12,ly:52,anchor:'start'});
  if(showReact)g+=arrow(px,140,px-fl,140,'var(--react)',S.mode==='wall'?'壁がAを押す力（Aが受ける）':'BがAを押す力（Aが受ける）',{lx:px-12,ly:188,anchor:'end'});
  if(showAct)g+=`<line x1="${px}" y1="66" x2="${px}" y2="${y}" stroke="var(--sub)" stroke-width="2" stroke-dasharray="6 6"/>`;
  if(st===2&&!contact&&S.t>0)g+=`<text x="500" y="${G+44}" text-anchor="middle" font-size="22" font-weight="700" style="fill:var(--sub)">${S.mode==='wall'?'何も動かない…？':'Bだけが動いて、Aは止まったまま…？'}</text>`;
  if(st===4&&!contact)g+=`<text x="500" y="${G+44}" text-anchor="middle" font-size="22" font-weight="700" style="fill:var(--sub)">手がはなれると力はなくなり、そのままの速さで進む</text>`;
  $('simSvg').innerHTML=g;
  const L=STEPS[S.mode][st];
  $('simLead').innerHTML=L[0];$('simNote2').innerHTML=L[1];$('simNote').textContent='質量や力を変えて試せます。床との摩擦は考えない。';
  $('stepNo').textContent=`${st+1} / 5`;
  $('sPrev').disabled=st===0;$('sNext').disabled=st===4;
  $('play').hidden=!animSteps.includes(st);
  // meter
  const vA=st===4?S.F*S.T/S.mA:0, vB=(st>=2&&S.mode!=='wall')?S.F*S.T/S.mB:0, vmax=400*S.T/30;
  const done=S.t>=S.T;
  const bar=(lab,c,v,txt)=>`<span>${lab}</span><div class="bar"><i style="width:${v}%;background:${c}"></i></div><span>${txt}</span>`;
  $('meter').innerHTML=
    bar(`<i class="key" style="background:var(--act)"></i>${S.mode==='wall'?'A→壁':'A→B'}`,'var(--act)',st>=1?S.F/4:0,st>=1?S.F+' N':'—')+
    bar(`<i class="key" style="background:var(--react)"></i>${S.mode==='wall'?'壁→A':'B→A'}`,'var(--react)',st>=3?S.F/4:0,st>=3?S.F+' N':(st===2?'0 N（仮）':'—'))+
    bar('Aの速さ','var(--ink)',done?vA/vmax*100:0,done&&animSteps.includes(st)?vA.toFixed(1)+' m/s':'—')+
    (S.mode==='wall'?'':bar('Bの速さ','var(--ink)',done?vB/vmax*100:0,done&&animSteps.includes(st)?vB.toFixed(1)+' m/s':'—'));
}
let last=0;
function loop(ts){
  if(!S.run)return;
  const dt=Math.min(0.05,(ts-last)/1000);last=ts;
  S.t+=dt*(S.slow?0.25:1);
  const {xA,xB}=posAt(S.t);
  if(xA*SCALE<-380||xB*SCALE>380||S.t>4)S.run=false;
  drawSim(); if(S.run)requestAnimationFrame(loop);
}
function go(n){S.step=Math.max(0,Math.min(4,n));S.run=false;S.t=0;drawSim()}
$('sPrev').onclick=()=>go(S.step-1);
$('sNext').onclick=()=>go(S.step+1);
$('play').onclick=()=>{S.t=0;S.run=true;last=performance.now();
  if(reduce){S.t=S.T+1;S.run=false;drawSim();return}
  requestAnimationFrame(loop)};
$('reset').onclick=()=>go(0);
$('slow').onclick=e=>{S.slow=!S.slow;e.currentTarget.setAttribute('aria-pressed',S.slow)};
const bind=(id,key,unit,out)=>$(id).oninput=e=>{S[key]=+e.target.value;$(out).textContent=S[key]+' '+unit;S.run=false;S.t=0;drawSim()};

  sel=sel.includes(id)?sel.filter(x=>x!==id):[...sel,id].slice(-2);drawBal()};
function drawBal(){
  const on=id=>sel.length===0||sel.includes(id);
  const hl=o=>sel.some(id=>forces.find(f=>f.id===id).on===o);
  let g=`<rect x="0" y="420" width="1000" height="40" fill="var(--floor)" opacity=".35"/>
   <text x="980" y="448" text-anchor="end" font-size="20" style="fill:var(--sub)">地球</text>

   <text x="760" y="245" font-size="24" font-weight="700">机</text>
   <rect x="400" y="170" width="200" height="80" rx="6" fill="var(--obj)" ${hl('本')?'stroke="var(--ink)" stroke-width="5"':''}/>

   ${hl('地球')?'<rect x="0" y="420" width="1000" height="40" fill="none" stroke="var(--ink)" stroke-width="5"/>':''}`;
  g+=arrow(440,210,440,360,'var(--act)','重力',{op:on('g')?1:.15,lx:395,ly:330});
  g+=arrow(500,250,500,110,'var(--ok)','垂直抗力',{op:on('n')?1:.15,ly:95});
  g+=arrow(560,250,560,390,'var(--react)','本→机',{op:on('p')?1:.15,lx:625,ly:330});
  g+=arrow(860,440,860,330,'var(--sub)','本→地球',{op:on('e')?1:.15,ly:315});
  $('balSvg').innerHTML=g;
  [...$('flist').children].forEach(b=>b.setAttribute('aria-pressed',sel.includes(b.dataset.id)));
  if(sel.length<2){$('verdict').textContent=sel.length?'もう1つ選んでください':'2つ選んでください';$('verdict').style.color='';$('chk').innerHTML='';return}
  const [a,b]=sel.map(id=>forces.find(f=>f.id===id));
  const same=a.on===b.on, opp=a.dir!==b.dir, swap=a.on===b.by&&b.on===a.by;
  let v,col;
  if(same&&opp){v='⚖️ つり合いの関係（同じ「'+a.on+'」が受ける）';col='var(--ok)'}
  else if(swap){v='🔁 作用・反作用の関係（'+a.on+'と'+b.on+'、別々の物体）';col='var(--act)'}
  else {v='どちらの関係でもない';col='var(--sub)'}
  $('verdict').textContent=v;$('verdict').style.color=col;
  const item=(t,y)=>`<span class="${y?'y':'n'}">${t} ${y?'○':'×'}</span>`;
  $('chk').innerHTML=item('大きさ等しい',same&&opp||swap)+item('向き反対',opp)+item('同じ物体',same)+item('誰が↔誰に 入れかえ',swap);
}
