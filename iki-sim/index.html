<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>吸う息とはく息</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
  :root{
    --paper:#FAF8F3; --ink:#1A2B4C; --sub:#5A6577; --accent:#D9772B;
    --air:#9AA7B8; --line:#DDD7CA; --frame:#ECE8DF; --night:#2E4260; --skin:#C9D1DD;
    color-scheme:light;
  }
  html,body{background:var(--frame);color:var(--ink)}
  body{font-family:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;padding-inline:16px;padding-block:16px}
  .wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:12px}

  .stage{position:relative;width:100%;aspect-ratio:16/9;background:var(--paper);border-radius:6px;overflow:hidden;display:grid;place-items:center}
  .stage:fullscreen{aspect-ratio:auto;width:100vw;height:100vh;border-radius:0}
  .canvas{position:relative;width:100%;aspect-ratio:16/9;container-type:inline-size}
  .stage:fullscreen .canvas{width:min(100vw,177.78vh)}

  .scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6cqw;opacity:0;transition:opacity .6s ease;pointer-events:none;padding:3cqw}
  .scene.on{opacity:1}
  .mid{font-size:3.8cqw;font-weight:700;text-align:center;text-wrap:balance}
  .note{font-size:2.3cqw;color:var(--sub);text-align:center}
  .count{font-size:17cqw;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1}
  .count.word{font-size:11cqw}
  .num{font-size:11cqw;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1.05}
  .num small{font-size:4cqw;color:var(--ink);margin-inline:.6cqw}
  .fig{width:62cqw;height:auto;max-width:100%}
  .fig.wide{width:80cqw}
  .cap{font-size:3.4cqw;font-weight:700;text-align:center}

  /* 風船 */
  .balloon{transform-box:view-box;transform-origin:250px 180px;transform:scale(.2)}
  .scene.on .balloon{animation:inflate 4.4s ease-out forwards}
  @keyframes inflate{0%{transform:scale(.2)}22%{transform:scale(.45)}30%{transform:scale(.45)}52%{transform:scale(.72)}60%{transform:scale(.72)}85%,100%{transform:scale(1)}}

  /* 白い息 */
  .puff{transform-box:fill-box;transform-origin:center;opacity:0}
  .scene.on .puff{animation:puff 2.6s ease-out infinite;animation-delay:var(--dl)}
  @keyframes puff{0%{opacity:0;transform:translate(0,0) scale(.3)}15%{opacity:.85}100%{opacity:0;transform:translate(190px,-35px) scale(2.2)}}

  /* 問いの「？」 */
  .q{font-weight:700;fill:var(--accent)}
  .scene.on .bob{animation:bob 1.6s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

  .final .ask{font-size:6.4cqw;font-weight:700;text-align:center;line-height:1.4;text-wrap:balance}
  .final .ask em{font-style:normal;color:var(--accent)}
  .final .rule{width:46cqw;height:.5cqw;background:var(--accent);border-radius:1cqw;transform:scaleX(0);transform-origin:left}
  .scene.on .rule{animation:draw .9s .5s ease-out forwards}
  @keyframes draw{to{transform:scaleX(1)}}
  .final .todo{font-size:3cqw;font-weight:700;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:1cqw;padding:1.2cqw 2.4cqw}

  .stage.paused *{animation-play-state:paused!important}

  .start{position:absolute;inset:0;display:grid;place-items:center;background:rgba(250,248,243,.55);border:0;cursor:pointer;font:inherit;color:var(--ink)}
  .start[hidden]{display:none}
  .start span{display:flex;align-items:center;gap:1cqw;background:var(--ink);color:#fff;font-size:2.6cqw;font-weight:700;padding:1.4cqw 3cqw;border-radius:5cqw}
  .start:focus-visible span{outline:3px solid var(--accent);outline-offset:4px}

  .bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .bar button{font:inherit;font-size:15px;font-weight:700;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer}
  .bar button:hover{border-color:var(--ink)}
  .bar button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .track{flex:1 1 240px;display:flex;gap:4px;height:12px}
  .seg{position:relative;background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;cursor:pointer;padding:0}
  .seg i{position:absolute;inset:0;background:var(--accent);transform:scaleX(0);transform-origin:left}
  .time{font-size:14px;color:var(--sub);font-variant-numeric:tabular-nums;min-width:5.5em;text-align:right}
  .hint{font-size:13px;color:var(--sub)}

  @media (prefers-reduced-motion: reduce){
    .scene{transition:none}
    .scene.on .balloon{animation:none;transform:scale(1)}
    .scene.on .puff{animation:none;opacity:.6}
  }
</style>

<div class="wrap">
  <div class="stage paused" id="stage">
    <div class="canvas">

      <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <defs>
          <symbol id="head" viewBox="0 0 200 240">
            <path d="M58,240 L60,175 C38,162 28,132 32,100 C36,55 70,22 112,22 C150,22 172,52 170,88 L186,116 C189,121 186,125 181,125 L172,126 L173,139 C174,149 167,155 159,155 L152,155 L151,170 C150,184 140,190 126,190 L122,240 Z"/>
          </symbol>
        </defs>
      </svg>

      <!-- 1 息を止める -->
      <section class="scene" data-d="7500" aria-label="息を止めてみよう">
        <div class="mid">ちょっと、息を止めてみよう</div>
        <div class="count" id="cd">5</div>
        <div class="note" id="cdnote">鼻も口も、とじて…</div>
      </section>

      <!-- 2 1日の回数 -->
      <section class="scene" data-d="6500" aria-label="1日の呼吸の回数">
        <div class="mid">わたしたちは 1日に</div>
        <div class="num"><small>約</small><span id="ct">0</span><small>回</small></div>
        <div class="mid">呼吸をしている</div>
        <div class="note">1分間に約15回 × 60分 × 24時間</div>
      </section>

      <!-- 3 風船 -->
      <section class="scene" data-d="5500" aria-label="はいた息で風船がふくらむ">
        <svg class="fig" viewBox="0 0 600 300" role="img" aria-label="息で風船をふくらませる横顔">
          <use href="#head" x="50" y="50" width="200" height="240" fill="#C9D1DD" stroke="#1A2B4C" stroke-width="3"/>
          <g class="balloon">
            <path d="M232,188 L256,176 L256,196 Z" fill="#B85F1C"/>
            <ellipse cx="370" cy="186" rx="116" ry="92" fill="#D9772B"/>
            <ellipse cx="330" cy="150" rx="26" ry="14" fill="#fff" opacity=".35"/>
          </g>
        </svg>
        <div class="cap">はいた息で、風船がふくらむ</div>
      </section>

      <!-- 4 白い息 -->
      <section class="scene" data-d="5500" aria-label="寒い日の白い息">
        <svg class="fig" viewBox="0 0 600 300" role="img" aria-label="寒い日に白い息をはく横顔">
          <rect x="0" y="0" width="600" height="300" rx="18" fill="#2E4260"/>
          <g fill="#fff" opacity=".7">
            <circle cx="440" cy="40" r="3"/><circle cx="520" cy="80" r="2.5"/><circle cx="380" cy="95" r="2"/>
            <circle cx="560" cy="200" r="3"/><circle cx="470" cy="250" r="2"/><circle cx="60" cy="40" r="2.5"/>
          </g>
          <use href="#head" x="110" y="60" width="200" height="240" fill="#8FA0B8" stroke="#E6ECF4" stroke-width="3"/>
          <g fill="#fff">
            <circle class="puff" cx="290" cy="196" r="16" style="--dl:0s"/>
            <circle class="puff" cx="290" cy="200" r="13" style="--dl:.45s"/>
            <circle class="puff" cx="292" cy="194" r="18" style="--dl:.9s"/>
            <circle class="puff" cx="288" cy="198" r="12" style="--dl:1.35s"/>
            <circle class="puff" cx="290" cy="197" r="15" style="--dl:1.8s"/>
          </g>
        </svg>
        <div class="cap">寒い日には、はいた息が白く見える</div>
      </section>

      <!-- 5 入る空気・出る空気 -->
      <section class="scene" data-d="8000" aria-label="入ってくる空気と出ていく空気">
        <svg class="fig wide" viewBox="0 0 800 300" role="img" aria-label="鼻から空気が入り、口から出ていく">
          <use href="#head" x="30" y="40" width="200" height="240" fill="#C9D1DD" stroke="#1A2B4C" stroke-width="3"/>
          <text x="500" y="108" font-size="26" font-weight="700" fill="#1A2B4C" text-anchor="middle">← 吸う息</text>
          <text x="500" y="244" font-size="26" font-weight="700" fill="#1A2B4C" text-anchor="middle">はく息 →</text>
          <g id="lanes"></g>
          <g class="bob"><text class="q" x="690" y="112" font-size="44" text-anchor="middle">？</text></g>
          <g class="bob" style="animation-delay:.5s"><text class="q" x="690" y="250" font-size="44" text-anchor="middle">？</text></g>
        </svg>
        <div class="cap">入ってくる空気と、出ていく空気</div>
      </section>

      <!-- 6 同じ？ちがう？ -->
      <section class="scene" data-d="6500" aria-label="同じ空気かちがう空気か">
        <svg class="fig wide" viewBox="0 0 800 300" role="img" aria-label="吸う息とはく息のびんに、中身の分からない粒が入っている">
          <text x="200" y="36" font-size="30" font-weight="700" fill="#1A2B4C" text-anchor="middle">吸う息</text>
          <text x="600" y="36" font-size="30" font-weight="700" fill="#1A2B4C" text-anchor="middle">はく息</text>
          <rect x="70" y="56" width="260" height="226" rx="26" fill="#fff" stroke="#1A2B4C" stroke-width="3"/>
          <rect x="470" y="56" width="260" height="226" rx="26" fill="#fff" stroke="#1A2B4C" stroke-width="3"/>
          <g id="jars" fill="#9AA7B8"></g>
          <g class="bob"><text class="q" x="200" y="200" font-size="96" text-anchor="middle">？</text></g>
          <g class="bob" style="animation-delay:.5s"><text class="q" x="600" y="200" font-size="96" text-anchor="middle">？</text></g>
        </svg>
        <div class="cap">同じ空気？　それとも、ちがう空気？</div>
      </section>

      <!-- 7 問い -->
      <section class="scene final" data-d="4000" aria-label="今日の問い">
        <div class="ask"><em>吸う息</em>と <em>はく息</em>は、<br>何がちがう？</div>
        <div class="rule"></div>
        <div class="todo">▶ ワークシート ３ に、自分の予想を書こう</div>
      </section>

      <button class="start" id="start" type="button" aria-label="再生をはじめる"><span>▶ クリックでスタート</span></button>
    </div>
  </div>

  <div class="bar">
    <button type="button" id="play">▶ 再生</button>
    <button type="button" id="restart">⟲ 最初から</button>
    <button type="button" id="fs">⛶ 全画面</button>
    <div class="track" id="track" aria-label="場面"></div>
    <span class="time" id="time">0 / 44秒</span>
  </div>
  <div class="hint">スペースキーで再生・一時停止、← → で場面を移動。最後の問いの画面で止まります。</div>
</div>

<script>
(() => {
  const stage = document.getElementById('stage');
  const scenes = [...document.querySelectorAll('.scene')];
  const durs = scenes.map(s => +s.dataset.d);
  const starts = durs.map((_, i) => durs.slice(0, i).reduce((a, b) => a + b, 0));
  const total = durs.reduce((a, b) => a + b, 0);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const NS = 'http://www.w3.org/2000/svg';

  const playBtn = document.getElementById('play');
  const startBtn = document.getElementById('start');
  const timeEl = document.getElementById('time');
  const track = document.getElementById('track');

  // 場面ごとの進行バー
  const segs = durs.map((d, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'seg'; b.style.flex = d + ' 1 0';
    b.setAttribute('aria-label', (i + 1) + '番目の場面へ');
    b.appendChild(document.createElement('i'));
    b.addEventListener('click', () => jump(starts[i]));
    track.appendChild(b);
    return b.firstChild;
  });

  // 空気の粒（吸う息・はく息とも同じ見た目）
  const lanes = document.getElementById('lanes');
  const inDots = [], outDots = [];
  for (let k = 0; k < 11; k++) {
    for (const [arr, y] of [[inDots, 150], [outDots, 186]]) {
      const c = document.createElementNS(NS, 'circle');
      c.setAttribute('r', 9); c.setAttribute('fill', '#9AA7B8');
      c.dataset.off = k / 11; c.dataset.dy = (Math.sin(k * 2.3) * 10).toFixed(1);
      c.setAttribute('cy', y + +c.dataset.dy);
      lanes.appendChild(c); arr.push(c);
    }
  }
  // びんの中の粒（中身は見分けがつかない）
  const jars = document.getElementById('jars');
  const rnd = (s => () => (s = (s * 9301 + 49297) % 233280) / 233280)(7);
  for (const x0 of [70, 470]) {
    for (let k = 0; k < 26; k++) {
      const c = document.createElementNS(NS, 'circle');
      c.setAttribute('cx', (x0 + 28 + rnd() * 204).toFixed(1));
      c.setAttribute('cy', (80 + rnd() * 180).toFixed(1));
      c.setAttribute('r', 9);
      jars.appendChild(c);
    }
  }

  const cd = document.getElementById('cd'), cdnote = document.getElementById('cdnote');
  const ct = document.getElementById('ct');
  const hooks = [
    lt => {
      if (lt < 5000) {
        cd.textContent = 5 - Math.floor(lt / 1000); cd.classList.remove('word');
        cdnote.textContent = '鼻も口も、とじて…';
      } else {
        cd.textContent = 'ぷはっ！'; cd.classList.add('word');
        cdnote.textContent = '息を止めると、くるしいね';
      }
    },
    lt => {
      const p = Math.min(1, Math.max(0, (lt - 400) / 2600));
      const e = 1 - Math.pow(1 - p, 3);
      ct.textContent = Math.round(e * 20000).toLocaleString('ja-JP');
    },
    null, null,
    lt => {
      const span = 540, speed = 0.13;
      const place = (arr, dir) => arr.forEach(c => {
        let u = reduce ? +c.dataset.off : ((lt * speed / span) + +c.dataset.off) % 1;
        const x = dir < 0 ? 760 - u * span : 222 + u * span;
        const fade = dir < 0 ? Math.min(1, (1 - u) * 6) : Math.min(1, u * 6);
        c.setAttribute('cx', x.toFixed(1)); c.setAttribute('opacity', fade.toFixed(2));
      });
      place(inDots, -1); place(outDots, 1);
    },
    null, null
  ];

  let t = 0, playing = false, last = null, cur = -1, started = false;

  function sceneAt(time) {
    for (let i = 0; i < scenes.length; i++) if (time < starts[i] + durs[i]) return i;
    return scenes.length - 1;
  }
  function render() {
    const i = sceneAt(t);
    if (i !== cur) { scenes.forEach((s, k) => s.classList.toggle('on', k === i)); cur = i; }
    const lt = Math.min(t - starts[i], durs[i]);
    if (hooks[i]) hooks[i](lt);
    segs.forEach((seg, k) => {
      const f = Math.min(1, Math.max(0, (t - starts[k]) / durs[k]));
      seg.style.transform = 'scaleX(' + f + ')';
    });
    timeEl.textContent = Math.floor(t / 1000) + ' / ' + Math.round(total / 1000) + '秒';
  }
  function setPlaying(p) {
    playing = p; last = null;
    stage.classList.toggle('paused', !p);
    playBtn.textContent = p ? '⏸ 一時停止' : '▶ 再生';
    if (p && !started) { started = true; startBtn.hidden = true; }
  }
  function jump(time) {
    t = Math.max(0, Math.min(total, time));
    cur = -1; scenes.forEach(s => s.classList.remove('on')); void stage.offsetWidth;
    render();
    if (!started) { started = true; startBtn.hidden = true; }
    if (!playing) setPlaying(true);
  }
  function loop(ts) {
    if (playing) {
      if (last !== null) t += ts - last;
      last = ts;
      if (t >= total) { t = total; setPlaying(false); }
      render();
    }
    requestAnimationFrame(loop);
  }

  startBtn.addEventListener('click', () => setPlaying(true));
  playBtn.addEventListener('click', () => {
    if (!playing && t >= total) { jump(0); return; }
    setPlaying(!playing);
  });
  document.getElementById('restart').addEventListener('click', () => jump(0));
  document.getElementById('fs').addEventListener('click', () => {
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else { const r = stage.requestFullscreen && stage.requestFullscreen(); if (r && r.catch) r.catch(() => {}); }
    } catch (e) {}
  });
  document.addEventListener('keydown', e => {
    if (e.target.closest && e.target.closest('input,textarea')) return;
    if (e.code === 'Space') { e.preventDefault(); playBtn.click(); }
    else if (e.key === 'ArrowRight') jump(starts[Math.min(scenes.length - 1, cur + 1)]);
    else if (e.key === 'ArrowLeft') jump(starts[Math.max(0, cur - 1)]);
  });

  render();
  requestAnimationFrame(loop);
})();
</script>

</body></html>
